<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RA | Manutenção Industrial - Torno CNC</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- HUD -->
  <header id="hud">
    <div class="hud-text">
      <strong>TORNO CNC • APOIO À MANUTENÇÃO</strong>
      <span id="status">Inicializando a câmera...</span>
    </div>
    <span id="badge">INICIANDO</span>
  </header>

  <!-- Hotspots (botões HTML). data-x/y/z = posição relativa ao target -->
  <div id="hotspot-layer">
    <button class="hotspot" type="button" data-topic="placa"
            data-x="-0.34" data-y="0.02" data-z="0.03"
            aria-label="Cabeçote e placa">1</button>

    <button class="hotspot" type="button" data-topic="torre"
            data-x="0.07" data-y="0.03" data-z="0.03"
            aria-label="Torre de ferramentas">2</button>

    <button class="hotspot" type="button" data-topic="comando"
            data-x="0.36" data-y="0.15" data-z="0.03"
            aria-label="Painel de comando CNC">3</button>

    <button class="hotspot hotspot-danger" type="button" data-topic="seguranca"
            data-x="0.35" data-y="-0.16" data-z="0.03"
            aria-label="Proteção e segurança">4</button>

    <!-- Hotspot dinâmico: consulta a API Flask -->
    <button class="hotspot hotspot-monitor" type="button" data-topic="monitoramento"
            data-x="-0.05" data-y="-0.20" data-z="0.03"
            aria-label="Monitoramento">5</button>
  </div>

  <!-- Painel de informações -->
  <section id="info-panel" class="info-panel hidden" aria-live="polite">
    <button id="close-panel" class="close-button" type="button" aria-label="Fechar painel">×</button>
    <small>PONTO DO TORNO</small>
    <h2 id="info-title">Componente</h2>
    <p id="info-text">Descrição.</p>
    <p id="info-detail" class="detail">Detalhe.</p>

    <!-- Área dos dados vindos da API -->
    <div id="info-live" class="live hidden"></div>
    <button id="refresh-btn" class="refresh-button hidden" type="button">↻ Consultar novamente</button>
  </section>

  <!-- Cena RA -->
  <a-scene
    id="ar-scene"
    mindar-image="
      imageTargetSrc: assets/targets/torno-cnc.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-camera id="ar-camera" position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <!-- config.js ANTES do app.js -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
