<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WebAR | Apoio à Manutenção FUR-01</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Bibliotecas A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <!-- HUD Superior de Status -->
    <header id="hud">
        <div class="hud-text">
            <strong>FURADEIRA INDUSTRIAL • FUR-01</strong>
            <span id="status">Inicializando sistema...</span>
        </div>
        <span id="badge">INICIANDO</span>
    </header>

    <!-- Camada dos 4 Hotspots -->
    <div id="hotspot-layer">
        <button class="hotspot" type="button" data-topic="base" data-x="-0.30" data-y="-0.25" data-z="0.03" aria-label="Base e Fixação">1</button>
        <button class="hotspot" type="button" data-topic="coluna" data-x="-0.25" data-y="0.05" data-z="0.03" aria-label="Coluna Estrutural">2</button>
        <button class="hotspot" type="button" data-topic="cabecote" data-x="0.00" data-y="0.25" data-z="0.03" aria-label="Motor e Cabeçote">3</button>
        <button class="hotspot hotspot-dynamic" type="button" data-topic="monitoramento" data-x="0.30" data-y="0.00" data-z="0.03" aria-label="Monitoramento em Tempo Real">4</button>
    </div>

    <!-- Painel de Informações Pop-up -->
    <section id="info-panel" class="info-panel hidden" aria-live="polite">
        <button id="close-panel" class="close-button" type="button" aria-label="Fechar painel">×</button>
        <small id="info-category">MANUTENÇÃO INDUSTRIAL</small>
        <h2 id="info-title">Componente</h2>
        <div id="info-body">
            <p id="info-text">Carregando dados...</p>
            <p id="info-detail" class="detail"></p>
        </div>
    </section>

    <!-- Cena WebAR (A-Frame + MindAR) -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: assets/targets/furadeira.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded>
        
        <a-camera id="ar-camera" position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script src="js/app.js"></script>
    <script src="js/config.js"></script>
</body>
</html>
