services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: ra-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ra-backend
    ports:
      - "5000:5000"
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    depends_on:
      - mqtt
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: ra-simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      EQUIP_ID: CNC-01
      SIM_INTERVALO: "5"
    depends_on:
      - mqtt
    restart: unless-stopped
