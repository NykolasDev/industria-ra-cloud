version: '3.8'

services:
  broker_mqtt:
    image: eclipse-mosquitto:2.0
    container_name: broker_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend_api:
    build: ./backend
    container_name: backend_api
    ports:
      - "5000:5000"
    environment:
      - MQTT_BROKER=broker_mqtt
      - MQTT_PORT=1883
    depends_on:
      - broker_mqtt

  simulador_telemetria:
    build: ./simulator
    container_name: simulador_telemetria
    environment:
      - MQTT_BROKER=broker_mqtt
      - MQTT_PORT=1883
    depends_on:
      - broker_mqtt